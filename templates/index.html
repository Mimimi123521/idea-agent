<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<title>灵感管家</title>
<style>
:root {
  --brand: #7c3aed; --brand-light: #a78bfa; --brand-dark: #5b21b6;
  --bg: #f8f9fc; --surface: #ffffff; --ink: #1a2332; --muted: #6b7a8e;
  --border: #e5e8f0; --shadow: 0 1px 3px rgba(0,0,0,.08);
  --green: #10b981; --orange: #f59e0b; --red: #ef4444;
  --radius: 10px; --radius-lg: 16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

/* ====== App Shell ====== */
.app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative;}
.app-header{flex-shrink:0;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:10;}
.app-header h1{font-size:16px;font-weight:700;white-space:nowrap;}
.app-header h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:4px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.header-actions{display:flex;gap:6px;align-items:center;}
.header-btn{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg);color:var(--muted);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ====== Global Search Bar ====== */
.search-bar{flex-shrink:0;padding:8px 12px;background:var(--surface);display:flex;gap:6px;align-items:center;}
.search-bar input{flex:1;border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:13px;font-family:var(--font);outline:none;background:var(--bg);color:var(--ink);}
.search-bar input:focus{border-color:var(--brand-light);}
.search-bar .search-date{width:100px;border:1px solid var(--border);border-radius:999px;padding:7px 8px;font-size:12px;font-family:var(--font);outline:none;background:var(--bg);color:var(--ink);}
.search-bar .search-btn{width:32px;height:32px;border-radius:50%;border:none;background:var(--brand);color:#fff;font-size:14px;cursor:pointer;flex-shrink:0;}

/* ====== Tabs ====== */
.tab-bar{flex-shrink:0;display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 4px;overflow-x:auto;scrollbar-width:none;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-btn{flex-shrink:0;padding:10px 11px;font-size:12px;font-weight:500;color:var(--muted);border:none;background:none;cursor:pointer;position:relative;transition:color .2s;white-space:nowrap;}
.tab-btn.active{color:var(--brand);}
.tab-btn.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:18px;height:3px;border-radius:2px;background:var(--brand);}
.tab-btn .count{display:inline-block;margin-left:3px;font-size:10px;background:var(--bg);padding:1px 5px;border-radius:8px;color:var(--muted);}
.tab-btn.active .count{background:#ede9fe;color:var(--brand);}

/* ====== Content Area ====== */
.content-area{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 10px 4px;scroll-behavior:smooth;}
.content-area::-webkit-scrollbar{width:4px;}
.content-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* ====== Idea Cards ====== */
.idea-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);transition:transform .15s;cursor:pointer;position:relative;}
.idea-card:active{transform:scale(.98);}
.idea-card .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;}
.idea-card .card-id{font-size:10px;color:var(--muted);font-weight:500;}
.idea-card .card-time{font-size:10px;color:var(--muted);white-space:nowrap;}
.idea-card .card-content{font-size:14px;line-height:1.6;margin-bottom:8px;word-break:break-word;}
.idea-card .card-bottom{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.idea-card .tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--border);}
.idea-card .tag.work{background:#ede9fe;color:var(--brand);border-color:var(--brand-light);}
.idea-card .tag.life{background:#fef3c7;color:#92400e;border-color:var(--orange);}
.idea-card .tag.todo{background:#fef3c7;color:#92400e;border-color:var(--orange);}
.idea-card .tag.tag-clickable{cursor:pointer;transition:transform .15s;}
.idea-card .tag.tag-clickable:active{transform:scale(.92);}

/* ====== Empty State ====== */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;text-align:center;color:var(--muted);}
.empty-state .icon{font-size:40px;margin-bottom:12px;opacity:.5;}
.empty-state h3{font-size:15px;font-weight:600;margin-bottom:6px;color:var(--ink);}
.empty-state p{font-size:12px;line-height:1.5;}

/* ====== Input Area ====== */
.input-area{flex-shrink:0;padding:6px 10px;padding-bottom:calc(6px + var(--safe-bottom));background:var(--surface);border-top:1px solid var(--border);}
.input-row{display:flex;gap:6px;align-items:flex-end;}
.input-row textarea{flex:1;border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:14px;font-family:var(--font);line-height:1.5;resize:none;min-height:38px;max-height:100px;outline:none;transition:border-color .2s;background:var(--bg);color:var(--ink);}
.input-row textarea:focus{border-color:var(--brand-light);}
.input-row .send-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--brand);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.input-row .send-btn:active{transform:scale(.9);background:var(--brand-dark);}
.input-row .send-btn:disabled{opacity:.4;cursor:not-allowed;}

/* ====== Detail Modal ====== */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;display:none;animation:fadeIn .2s;}
.modal-overlay.show{display:block;}
.modal-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;max-height:85vh;background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:101;overflow-y:auto;transition:transform .3s cubic-bezier(.32,.72,0,1);padding:14px 18px;padding-bottom:calc(14px + var(--safe-bottom));}
.modal-sheet.show{transform:translateX(-50%) translateY(0);}
.modal-sheet .handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 10px;}
.modal-sheet .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.modal-sheet .modal-header h2{font-size:15px;font-weight:700;}
.modal-sheet .close-btn{width:30px;height:30px;border:none;border-radius:50%;background:var(--bg);color:var(--muted);font-size:16px;cursor:pointer;}
.modal-section{margin-bottom:10px;}
.modal-section .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.modal-section .value{font-size:14px;line-height:1.6;}
.modal-section .search-result{background:var(--bg);border-radius:var(--radius);padding:8px 10px;margin-bottom:6px;}
.modal-section .search-result .s-title{font-size:13px;font-weight:600;margin-bottom:2px;}
.modal-section .search-result .s-title a{color:var(--brand);text-decoration:none;}
.modal-section .search-result .s-snippet{font-size:12px;color:var(--muted);line-height:1.5;}
.modal-actions{display:flex;gap:6px;margin-top:4px;}
.modal-actions button{flex:1;padding:9px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;color:var(--ink);}
.modal-actions button:active{transform:scale(.97);}
.modal-actions button.primary{background:var(--brand);color:#fff;border-color:var(--brand);}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ====== Domain Selector ====== */
.domain-selector{display:flex;gap:4px;margin-top:4px;}
.domain-selector .domain-btn{flex:1;padding:5px 6px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;text-align:center;color:var(--muted);}
.domain-selector .domain-btn:active{transform:scale(.95);}
.domain-selector .domain-btn.selected{color:#fff;border-color:transparent;}
.domain-selector .domain-btn.selected.work{background:var(--brand);}
.domain-selector .domain-btn.selected.life{background:var(--orange);}
.domain-selector .domain-btn.selected.process{background:#06b6d4;}
.domain-selector .domain-btn.selected.other{background:var(--green);}

/* ====== Reminder ====== */
.reminder-row{display:flex;gap:6px;align-items:center;margin-top:8px;}
.reminder-row input[type="datetime-local"]{flex:1;border:1px solid var(--border);border-radius:var(--radius);padding:7px 8px;font-size:12px;font-family:var(--font);outline:none;background:var(--bg);color:var(--ink);}
.reminder-row .remind-btn{padding:7px 12px;border:none;border-radius:var(--radius);background:var(--brand);color:#fff;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;}
.reminder-row .remind-btn:disabled{opacity:.4;}

/* ====== Todo Card ====== */
.todo-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;transition:all .2s;}
.todo-card.completed{opacity:.5;background:var(--bg);}
.todo-card .todo-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.todo-card .todo-check:hover{border-color:var(--green);}
.todo-card.done .todo-check{background:var(--green);border-color:var(--green);}
.todo-card .todo-check::after{content:'✓';color:#fff;font-size:12px;display:none;}
.todo-card.done .todo-check::after{display:block;}
.todo-card .todo-body{flex:1;min-width:0;}
.todo-card .todo-content{font-size:14px;line-height:1.5;word-break:break-word;}
.todo-card .todo-time{font-size:11px;color:var(--muted);margin-top:2px;}
.todo-card .todo-domain{font-size:10px;padding:1px 6px;border-radius:999px;display:inline-block;margin-top:2px;}
.todo-card .todo-domain.work{background:#ede9fe;color:var(--brand);}
.todo-card .todo-domain.life{background:#fef3c7;color:#92400e;}
.todo-card .todo-overdue{color:var(--red);font-weight:600;}

/* ====== Memory Card ====== */
.memory-section{margin-bottom:8px;}
.memory-section .mem-label{font-size:12px;font-weight:600;color:var(--brand);margin-bottom:6px;padding:4px 0;}
.memory-card{background:var(--surface);border:1px solid var(--brand-light);border-radius:var(--radius);padding:10px 12px;margin-bottom:6px;box-shadow:var(--shadow);}
.memory-card .mem-date{font-size:11px;color:var(--muted);margin-bottom:4px;}
.memory-card .mem-content{font-size:13px;line-height:1.5;}

/* ====== Bell Badge ====== */
.bell-badge{position:absolute;top:-2px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--surface);}

/* ====== Notification Panel ====== */
.notif-panel{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;max-height:70vh;background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:101;overflow-y:auto;transition:transform .3s cubic-bezier(.32,.72,0,1);padding:14px 18px;padding-bottom:calc(14px + var(--safe-bottom));}
.notif-panel.show{transform:translateX(-50%) translateY(0);}
.notif-panel .handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 10px;}
.notif-item{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);}
.notif-item .n-icon{width:28px;height:28px;border-radius:50%;background:#fef3c7;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.notif-item .n-body{flex:1;min-width:0;}
.notif-item .n-title{font-size:12px;font-weight:600;margin-bottom:2px;}
.notif-item .n-time{font-size:10px;color:var(--muted);margin-bottom:2px;}
.notif-item .n-msg{font-size:12px;color:var(--ink);line-height:1.5;}
.notif-item .n-action{flex-shrink:0;}
.notif-item .n-action button{width:24px;height:24px;border:none;border-radius:50%;background:var(--bg);color:var(--muted);font-size:12px;cursor:pointer;}

/* ====== Toast ====== */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:var(--radius);font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:400px;text-align:center;}
.toast.show{opacity:1;}

/* ====== Stats ====== */
.stats-chip{display:flex;gap:4px;flex-wrap:wrap;padding:6px 0;}
.stats-chip .chip{font-size:10px;padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--border);color:var(--muted);}
.stats-chip .chip strong{color:var(--ink);}

/* ====== Loading ====== */
.loading-dots{display:flex;gap:4px;align-items:center;justify-content:center;padding:20px;}
.loading-dots span{width:6px;height:6px;border-radius:50%;background:var(--brand-light);animation:bounce 1.4s infinite;}
.loading-dots span:nth-child(2){animation-delay:.2s;}
.loading-dots span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}

/* ====== Search Results ====== */
.search-results .search-header{font-size:12px;color:var(--muted);padding:6px 0;}

/* ====== Review Card ====== */
.review-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;transition:all .15s;}
.review-card:active{transform:scale(.98);}
.review-card .review-date{font-size:11px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.review-card .review-date .date-badge{background:#ede9fe;color:var(--brand);padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;}
.review-card .review-section{margin-bottom:8px;margin-top:8px;border-top:1px solid var(--border);padding-top:8px;}
.review-card .review-section .rs-label{font-size:11px;font-weight:600;color:var(--brand);margin-bottom:3px;}
.review-card .review-section .rs-content{font-size:13px;line-height:1.6;color:var(--ink);white-space:pre-wrap;}
.review-input-area{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:10px;}
.review-input-area textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:14px;font-family:var(--font);line-height:1.6;resize:vertical;min-height:70px;max-height:180px;outline:none;background:var(--bg);color:var(--ink);margin-bottom:6px;}
.review-input-area textarea:focus{border-color:var(--brand-light);}
.review-submit-btn{width:100%;padding:9px;border:none;border-radius:var(--radius);background:var(--brand);color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
.review-submit-btn:active{transform:scale(.97);}
.review-submit-btn:disabled{opacity:.4;}

/* ====== Responsive ====== */
@media (min-width:480px){
  .app{box-shadow:0 0 20px rgba(0,0,0,.06);border-left:1px solid var(--border);border-right:1px solid var(--border);}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="app-header">
    <h1><span class="dot"></span>灵感管家</h1>
    <div class="header-actions">
      <button class="header-btn" id="bellBtn" onclick="toggleNotificationPanel()" title="通知" style="position:relative;">
        🔔<span class="bell-badge" id="bellBadge" style="display:none;">0</span>
      </button>
      <button class="header-btn" onclick="refreshCurrent()" title="刷新">↻</button>
    </div>
  </header>

  <!-- Global Search -->
  <div class="search-bar">
    <input type="text" id="globalSearchInput" placeholder="搜索灵感…" onkeydown="if(event.key==='Enter')doGlobalSearch()">
    <input type="date" class="search-date" id="globalSearchDate" title="按日期搜索" onchange="doGlobalSearch()">
    <button class="search-btn" onclick="doGlobalSearch()">🔍</button>
  </div>

  <!-- Tab Bar -->
  <nav class="tab-bar" id="tabBar">
    <button class="tab-btn active" data-tab="all" onclick="switchTab('all')">全部</button>
    <button class="tab-btn" data-tab="work" onclick="switchTab('work')">🔧 工作 <span class="count" id="countWork">0</span></button>
    <button class="tab-btn" data-tab="life" onclick="switchTab('life')">🌱 生活 <span class="count" id="countLife">0</span></button>
    <button class="tab-btn" data-tab="todo-list" onclick="switchTab('todo-list')">✅ 今日待办 <span class="count" id="countTodo">0</span></button>
    <button class="tab-btn" data-tab="review" onclick="switchTab('review')">📋 复盘</button>
  </nav>

  <!-- Content -->
  <div class="content-area" id="contentArea">
    <div class="stats-chip" id="statsChip"></div>
    <div id="memorySection"></div>
    <div id="ideaList"></div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <textarea id="ideaInput" rows="1" placeholder="输入你的灵感…" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="submitIdea()">↑</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
<div class="modal-sheet" id="modalSheet">
  <div class="handle"></div>
  <div class="modal-header">
    <h2 id="modalTitle">灵感详情</h2>
    <button class="close-btn" onclick="closeModal()">✕</button>
  </div>
  <div id="modalBody"></div>
</div>

<!-- Notification Panel -->
<div class="modal-overlay" id="notifOverlay" onclick="closeNotificationPanel()"></div>
<div class="notif-panel" id="notifPanel">
  <div class="handle"></div>
  <div class="modal-header">
    <h2>🔔 通知提醒</h2>
    <button class="close-btn" onclick="closeNotificationPanel()">✕</button>
  </div>
  <div id="notifBody"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ====== State ======
let allIdeas = [];
let currentTab = 'all';
let todoItems = [];
let notifInterval = null;

// ====== Auto Resize ======
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

document.getElementById('ideaInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitIdea(); }
});

// ====== Toast ======
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ====== Tab Switching ======
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab === 'review') {
    renderReview();
  } else if (tab === 'todo-list') {
    fetchTodos();
  } else {
    fetchIdeas();
  }
}

// ====== Fetch Ideas ======
async function fetchIdeas() {
  try {
    const params = new URLSearchParams();
    if (currentTab === 'work') params.set('domain', 'work');
    else if (currentTab === 'life') params.set('domain', 'life');
    else if (currentTab === 'todo-list') params.set('decision__in', 'todo-work,todo-life');
    const resp = await fetch('/api/ideas?' + params.toString());
    const data = await resp.json();
    allIdeas = data.ideas || [];
    renderStats(data.stats);
    renderIdeas();
    if (currentTab === 'all') fetchMemories();
  } catch(e) { showToast('加载失败，请检查网络'); }
}

function renderStats(stats) {
  if (!stats) return;
  const chip = document.getElementById('statsChip');
  chip.innerHTML = `
    <span class="chip">📋 共 <strong>${stats.total||0}</strong> 条</span>
    <span class="chip">🔧 <strong>${stats.work||0}</strong></span>
    <span class="chip">🌱 <strong>${stats.life||0}</strong></span>
    <span class="chip">✅ 待办 <strong>${(stats.todo_work||0)+(stats.todo_life||0)}</strong></span>`;
  document.getElementById('countWork').textContent = stats.work||0;
  document.getElementById('countLife').textContent = stats.life||0;
  document.getElementById('countTodo').textContent = (stats.todo_work||0)+(stats.todo_life||0);
}

function renderIdeas() {
  const container = document.getElementById('ideaList');
  if (currentTab === 'todo-list' || currentTab === 'review') return;
  let ideas = allIdeas;
  if (currentTab === 'work') ideas = allIdeas.filter(i => i.domain === 'work');
  else if (currentTab === 'life') ideas = allIdeas.filter(i => i.domain === 'life');

  if (!ideas.length) {
    container.innerHTML = `<div class="empty-state"><div class="icon">💡</div><h3>还没有灵感</h3><p>在下方输入你的想法，Agent 会自动归类</p></div>`;
    return;
  }
  container.innerHTML = ideas.map(idea => `
    <div class="idea-card" onclick="openIdea(${idea.id})">
      <div class="card-top"><span class="card-id">#${idea.id}</span><span class="card-time">${idea.created_at || ''}</span></div>
      <div class="card-content">${escapeHtml(idea.content)}</div>
      <div class="card-bottom">${getCardTagHtml(idea)}</div>
    </div>`).join('');
}

// ====== Historical Memories ======
async function fetchMemories() {
  const section = document.getElementById('memorySection');
  try {
    const resp = await fetch('/api/memories');
    const data = await resp.json();
    let html = '';
    if (data.last_month && data.last_month.length > 0) {
      html += `<div class="memory-section"><div class="mem-label">📅 上个月今日</div>`;
      html += data.last_month.map(i => `<div class="memory-card" onclick="openIdea(${i.id})"><div class="mem-date">${i.created_at||''}</div><div class="mem-content">${escapeHtml(i.content)}</div></div>`).join('');
      html += `</div>`;
    }
    if (data.last_year && data.last_year.length > 0) {
      html += `<div class="memory-section"><div class="mem-label">🕰️ 去年今日</div>`;
      html += data.last_year.map(i => `<div class="memory-card" onclick="openIdea(${i.id})"><div class="mem-date">${i.created_at||''}</div><div class="mem-content">${escapeHtml(i.content)}</div></div>`).join('');
      html += `</div>`;
    }
    section.innerHTML = html;
  } catch(e) { section.innerHTML = ''; }
}

// ====== Global Search ======
async function doGlobalSearch() {
  const input = document.getElementById('globalSearchInput');
  const dateInput = document.getElementById('globalSearchDate');
  const keyword = input.value.trim();
  const dateVal = dateInput.value;
  if (!keyword && !dateVal) { showToast('请输入关键词或选择日期'); return; }
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  currentTab = 'search';
  const container = document.getElementById('ideaList');
  document.getElementById('memorySection').innerHTML = '';
  container.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
  try {
    const params = new URLSearchParams();
    if (keyword) params.set('keyword', keyword);
    if (dateVal) { params.set('date_from', dateVal); params.set('date_to', dateVal); }
    const resp = await fetch('/api/ideas/search?' + params.toString());
    const data = await resp.json();
    if (!data.results || !data.results.length) {
      container.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>未找到相关灵感</h3><p>尝试其他关键词或日期</p></div>`;
      return;
    }
    container.innerHTML = `<div class="search-results"><div class="search-header">找到 ${data.count} 条结果</div></div>` +
      data.results.map(idea => `
        <div class="idea-card" onclick="openIdea(${idea.id})">
          <div class="card-top"><span class="card-id">#${idea.id}</span><span class="card-time">${idea.created_at || ''}</span></div>
          <div class="card-content">${keyword ? highlightKeyword(escapeHtml(idea.content), keyword) : escapeHtml(idea.content)}</div>
          <div class="card-bottom">${getCardTagHtml(idea)}</div>
        </div>`).join('');
  } catch(e) { container.innerHTML = `<div class="empty-state"><p>搜索失败</p></div>`; }
}

function highlightKeyword(html, keyword) {
  const escaped = escapeHtml(keyword);
  return html.replace(new RegExp(`(${escaped.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<mark style="background:#ede9fe;padding:0 2px;border-radius:2px;">$1</mark>');
}

// ====== Today's Todos ======
async function fetchTodos() {
  const container = document.getElementById('ideaList');
  document.getElementById('memorySection').innerHTML = '';
  container.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
  try {
    const resp = await fetch('/api/todos');
    const data = await resp.json();
    todoItems = data.todos || [];
    renderTodos();
  } catch(e) { container.innerHTML = `<div class="empty-state"><p>加载失败</p></div>`; }
}

function renderTodos() {
  const container = document.getElementById('ideaList');
  if (!todoItems.length) {
    container.innerHTML = `<div class="empty-state"><div class="icon">✅</div><h3>今日暂无待办</h3><p>将灵感标记为待办后会出现在这里</p></div>`;
    return;
  }
  const now = new Date();
  container.innerHTML = todoItems.map(t => {
    const isOverdue = t.remind_at && new Date(t.remind_at.replace(' ','T')) < now;
    const domainLabel = (t.decision === 'todo-work') ? '🔧 工作' : '🌱 生活';
    const domainClass = (t.decision === 'todo-work') ? 'work' : 'life';
    return `
      <div class="todo-card" id="todo-${t.id}" onclick="openIdea(${t.id})">
        <div class="todo-check" onclick="event.stopPropagation();completeTodo(${t.id})"></div>
        <div class="todo-body">
          <div class="todo-content">${escapeHtml(t.content)}</div>
          <div style="display:flex;gap:6px;align-items:center;margin-top:2px;">
            <span class="todo-domain ${domainClass}">${domainLabel}</span>
            ${t.remind_at ? `<span class="todo-time ${isOverdue ? 'todo-overdue' : ''}">${isOverdue ? '⏰ 已过期' : '⏰'} ${formatTime(t.remind_at)}</span>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

async function completeTodo(id) {
  try {
    await fetch(`/api/todos/${id}/complete`, {method:'POST'});
    const card = document.getElementById('todo-' + id);
    if (card) { card.classList.add('done'); card.style.opacity = '0.5'; setTimeout(() => card.remove(), 400); }
    showToast('✅ 已完成');
  } catch(e) { showToast('操作失败'); }
}

// ====== Submit Idea ======
async function submitIdea() {

  const content = input.value.trim();

  const btn = document.getElementById('sendBtn');

// ====== Idea Detail Modal ======
async function openIdea(id) {
  try {
    const resp = await fetch(`/api/ideas/${id}`);
    const idea = await resp.json();
    showModal(idea);
  } catch(e) { showToast('加载失败'); }

function showModal(idea) {
  const overlay = document.getElementById('modalOverlay');
  const sheet = document.getElementById('modalSheet');
  const body = document.getElementById('modalBody');
  document.getElementById('modalTitle').textContent = `灵感 #${idea.id}`;

  let searchHtml = '';
  let results = [];
  try { results = JSON.parse(idea.search_results || '[]'); } catch(e) {}
  if (results.length) {
    searchHtml = results.map(r => `
      <div class="search-result">
        <div class="s-title"><a href="${r.url||'#'}" target="_blank">${escapeHtml(r.title||'无标题')}</a></div>
        <div class="s-snippet">${escapeHtml(r.snippet||'')}</div>
      </div>`).join('');
  }

  const tags = (idea.tags||'').split(',').filter(Boolean);
  const isTodo = idea.decision && idea.decision.startsWith('todo');
  const todoSection = isTodo ? `
    <div class="modal-section" style="background:#fefce8;border-radius:var(--radius);padding:10px 12px;">
      <div class="label" style="color:#92400e;">⏰ 待办提醒</div>
      <div class="reminder-row">
        <input type="datetime-local" id="remindTime" value="${getDefaultRemindTime()}">
        <button class="remind-btn" id="remindBtn" onclick="setReminder(${idea.id})">设置提醒</button>
      </div>
    </div>` : `
    <div class="modal-section" style="background:#f0fdf4;border-radius:var(--radius);padding:10px 12px;">
      <div class="label" style="color:#166534;">📋 加入待办</div>
      <div class="reminder-row" style="margin-bottom:6px;">
        <input type="datetime-local" id="remindTime" value="${getDefaultRemindTime()}">
      </div>
      <div style="display:flex;gap:6px;">
        <button onclick="markAsTodo(${idea.id}, 'todo-work')" style="flex:1;padding:7px 10px;border:none;border-radius:var(--radius);background:var(--brand);color:#fff;font-size:12px;font-weight:500;cursor:pointer;">🔧 工作待办</button>
        <button onclick="markAsTodo(${idea.id}, 'todo-life')" style="flex:1;padding:7px 10px;border:none;border-radius:var(--radius);background:var(--orange);color:#fff;font-size:12px;font-weight:500;cursor:pointer;">🌱 生活待办</button>
      </div>
    </div>`;

  body.innerHTML = `
    <div class="modal-section">
      <div class="label">内容</div>
      <div class="value">${escapeHtml(idea.content)}</div>
    </div>
    <div class="modal-section">
      <div class="label">时间</div>
      <div class="value">${idea.created_at||''}</div>
    </div>
    ${tags.length ? `<div class="modal-section">
      <div class="label">分类标签</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;">
        ${tags.map(t => `<span class="tag ${getTagClass(t)}">${getTagLabel(t)}</span>`).join('')}
      </div>
    </div>` : ''}
    <div class="modal-section">
      <div class="label">领域分类</div>
      <div class="domain-selector">
        <button class="domain-btn work ${(idea.domain||'')==='work'?'selected':''}" onclick="changeDomain(${idea.id},'work')">🔧 工作</button>
        <button class="domain-btn life ${(idea.domain||'')==='life'?'selected':''}" onclick="changeDomain(${idea.id},'life')">🌱 生活</button>
        <button class="domain-btn process ${(idea.domain||'')==='process'?'selected':''}" onclick="changeDomain(${idea.id},'process')">⚙️ 流程</button>
        <button class="domain-btn other ${(idea.domain||'')==='other'?'selected':''}" onclick="changeDomain(${idea.id},'other')">📎 其他</button>
      </div>
    </div>
    ${idea.decision ? `<div class="modal-section">
      <div class="label">决策结果</div>
      <div><span class="decision-badge ${idea.decision}">${getDecisionLabel(idea.decision)}</span></div>
    </div>` : ''}
    ${idea.suggestion ? `<div class="modal-section">
      <div class="label">建议</div>
      <div class="value">${idea.suggestion}</div>
    </div>` : ''}
    ${searchHtml ? `<div class="modal-section"><div class="label">搜索结果</div>${searchHtml}</div>` : ''}
    ${todoSection}
    <div class="modal-actions">
      <button onclick="searchIdea(${idea.id})">🔍 搜索背景</button>
      <button onclick="reanalyzeIdea(${idea.id})">📊 重新分析</button>
      <button onclick="deleteIdea(${idea.id})" style="color:var(--red);">🗑️ 删除</button>
    </div>
  `;
  overlay.classList.add('show');
  sheet.classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('modalSheet').classList.remove('show');
}

function getDefaultRemindTime() {
  const now = new Date();
  now.setMinutes(now.getMinutes() + 30);
  const pad = n => String(n).padStart(2,'0');
  return `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
}

async function setReminder(ideaId) {
  const input = document.getElementById('remindTime');
  const btn = document.getElementById('remindBtn');
  if (!input.value) { showToast('请选择提醒时间'); return; }
  btn.disabled = true; btn.textContent = '设置中…';
  try {
    const resp = await fetch(`/api/ideas/${ideaId}/reminder`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({remind_at: input.value.replace('T', ' ')})
    });
    const data = await resp.json();
    if (data.ok) { showToast('✅ 提醒已设置'); updateBellBadge(); }
  } catch(e) { showToast('设置失败'); } finally { btn.disabled = false; btn.textContent = '设置提醒'; }
}

async function markAsTodo(ideaId, decision) {
  const input = document.getElementById('remindTime');
  if (!input.value) { showToast('请选择提醒时间'); return; }
  try {
    await fetch(`/api/ideas/${ideaId}`, {
      method: 'PUT', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({decision: decision, suggestion: '用户手动标记为待办'})
    });
    await fetch(`/api/ideas/${ideaId}/reminder`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({remind_at: input.value.replace('T', ' ')})
    });
    showToast('✅ 已加入待办并设置提醒');
    updateBellBadge();
    fetchIdeas();
    openIdea(ideaId);
  } catch(e) { showToast('操作失败'); }
}

async function changeDomain(ideaId, domain) {
  try {
    await fetch(`/api/ideas/${ideaId}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({domain}) });
    showToast('✅ 分类已更新');
    fetchIdeas();
    openIdea(ideaId);
  } catch(e) { showToast('更新失败'); }
}

async function searchIdea(id) {
  try {
    await fetch(`/api/ideas/${id}/search`, {method:'POST'});
    showToast('搜索完成');
    openIdea(id);
  } catch(e) { showToast('搜索失败'); }
}

async function reanalyzeIdea(id) {
  try {
    await fetch(`/api/ideas/${id}/analyze`, {method:'POST'});

    fetchIdeas();
  } catch(e) { showToast('分析失败'); }

async function deleteIdea(id) {
  if (!confirm('确认删除这条灵感？')) return;
  try {
    await fetch(`/api/ideas/${id}`, {method:'DELETE'});

function toggleReviewDetail(id) {

async function submitReview() {
  const input = document.getElementById('reviewInput');
  const btn = document.getElementById('reviewSubmitBtn');

  if (!content) { showToast('请输入今天的工作内容'); return; }

async function deleteReview(id) {

  try { await fetch(`/api/reviews/${id}`, {method:'DELETE'}); showToast('已删除'); loadReviewList(); } catch(e) { showToast('删除失败'); }

// ====== Helpers ======
function escapeHtml(s) {
  if (!s) return '';
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function formatTime(t) {
  if (!t) return '';
  const d = new Date(t.replace(' ','T'));
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatReviewDate(t) {
  if (!t) return '复盘';
  const d = new Date(t.replace(' ','T'));
  const weekMap = ['周日','周一','周二','周三','周四','周五','周六'];
  return `${d.getMonth()+1}月${d.getDate()}日 ${weekMap[d.getDay()]} 复盘`;
}

const TAG_LABELS = {
  'engine-arch':'发动机架构','combustion':'燃烧/点火','hydrogen-safety':'氢气安全','test-bench':'台架试验',
  'nvh':'NVH/振动','materials':'材料/耐久','schedule':'进度/排期','resource':'人力/预算','risk':'风险',
  'quality':'质量/适航','supply-chain':'供应链','daily-thought':'日常感悟','personal-todo':'生活待办',
  'health':'健康','family':'家庭','learning':'学习','social':'社交','travel':'出行','finance':'理财',
  'procedure':'流程优化','regulation':'法规标准','doc':'文档','idea':'初步想法','question':'待研究','reference':'参考'
};

function getTagLabel(tag) { return TAG_LABELS[tag] || tag; }

function getTagClass(tag) {
  const workTags = ['engine-arch','combustion','hydrogen-safety','test-bench','nvh','materials','schedule','resource','risk','quality','supply-chain'];
  const lifeTags = ['daily-thought','personal-todo','health','family','learning','social','travel','finance'];
  if (workTags.includes(tag)) return 'work';
  if (lifeTags.includes(tag)) return 'life';
  return 'other';
}

function getDecisionLabel(d) {
  const m = {'todo-work':'✅ 工作待办','todo-life':'✅ 生活待办','stash':'📌 暂存','archive':'🗂️ 归档'};
  return m[d] || d;
}

function getCardTag(idea) {
  if (idea.decision && idea.decision.startsWith('todo')) return '待办';
  if (idea.domain === 'work') return '工作';
  if (idea.domain === 'life') return '生活';
  return null;
}

function getCardTagHtml(idea) {
  const tag = getCardTag(idea);
  if (!tag) return '';
  const cls = tag === '待办' ? 'todo' : tag.toLowerCase();
  const tabMap = { '工作': 'work', '生活': 'life', '待办': 'todo-list' };
  const tab = tabMap[tag];
  return `<span class="tag ${cls} tag-clickable" onclick="event.stopPropagation();switchTab('${tab}')">${tag}</span>`;
}

// ====== Version Check ======
const APP_VERSION = '3.0.2';

async function checkVersion() {
  try {
    const resp = await fetch('/api/version?_=' + Date.now());
    const data = await resp.json();
    if (data.version && data.version !== APP_VERSION) {
      if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())); }
      if ('caches' in window) { caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))); }
      setTimeout(() => window.location.reload(true), 800);
    }
  } catch(e) {}
}

// ====== Init ======
document.addEventListener('DOMContentLoaded', () => {
  fetchIdeas();
  checkVersion();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js?v=' + APP_VERSION).then(reg => {
      reg.update().catch(() => {});
      setInterval(() => reg.update().catch(() => {}), 15000);
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (!refreshing) { refreshing = true; window.location.reload(true); } });
    }).catch(() => {});
  }
  updateBellBadge();
  notifInterval = setInterval(() => { updateBellBadge(); }, 30000);
  document.addEventListener('click', () => { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); }, {once: true});
});
</script>
