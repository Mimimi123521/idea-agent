<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<title>灵感管家</title>
<style>
:root {
  --brand: #7c3aed; --brand-light: #a78bfa; --brand-dark: #5b21b6;
  --bg: #f8f9fc; --surface: #ffffff; --ink: #1a2332; --muted: #6b7a8e;
  --border: #e5e8f0; --shadow: 0 1px 3px rgba(0,0,0,.08);
  --radius: 10px; --radius-lg: 16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --nav-height: 64px; --input-height: 64px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

/* ====== App Shell ====== */
.app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative;}
.app-header{flex-shrink:0;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;z-index:10;}
.app-header h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;}
.app-header h1 .dot{width:8px;height:8px;border-radius:50%;background:#10b981;display:inline-block;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.header-actions{display:flex;gap:8px;}
.header-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--bg);color:var(--muted);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.header-btn:active{transform:scale(.92);background:var(--border);}

/* ====== Tabs ====== */
.tab-bar{flex-shrink:0;display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 8px;overflow-x:auto;scrollbar-width:none;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-btn{flex-shrink:0;padding:10px 14px;font-size:13px;font-weight:500;color:var(--muted);border:none;background:none;cursor:pointer;position:relative;transition:color .2s;white-space:nowrap;}
.tab-btn.active{color:var(--brand);}
.tab-btn.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:20px;height:3px;border-radius:2px;background:var(--brand);}
.tab-btn .count{display:inline-block;margin-left:4px;font-size:11px;background:var(--bg);padding:1px 6px;border-radius:8px;color:var(--muted);}
.tab-btn.active .count{background:#ede9fe;color:var(--brand);}

/* ====== Content Area ====== */
.content-area{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 12px 4px;scroll-behavior:smooth;}
.content-area::-webkit-scrollbar{width:4px;}
.content-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* ====== Idea Cards ====== */
.idea-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;cursor:pointer;position:relative;}
.idea-card:active{transform:scale(.98);box-shadow:0 1px 2px rgba(0,0,0,.05);}
.idea-card .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;}
.idea-card .card-id{font-size:11px;color:var(--muted);font-weight:500;}
.idea-card .card-time{font-size:11px;color:var(--muted);white-space:nowrap;}
.idea-card .card-content{font-size:14px;line-height:1.6;margin-bottom:10px;word-break:break-word;}
.idea-card .card-bottom{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.idea-card .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--border);}
.idea-card .tag.work{background:#ede9fe;color:var(--brand);border-color:var(--brand-light);}
.idea-card .tag.life{background:#fef3c7;color:#92400e;border-color:#f59e0b;}
.idea-card .tag.todo{background:#fef3c7;color:#92400e;border-color:#f59e0b;}
.idea-card .tag.tag-clickable{cursor:pointer;transition:transform .15s;}
.idea-card .tag.tag-clickable:active{transform:scale(.92);}
.idea-card .card-actions{position:absolute;top:8px;right:8px;opacity:0;transition:opacity .2s;}
.idea-card:hover .card-actions,.idea-card:active .card-actions{opacity:1;}
.idea-card .card-actions button{width:28px;height:28px;border:none;border-radius:50%;background:var(--bg);color:var(--muted);font-size:14px;cursor:pointer;}

/* ====== Empty State ====== */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;color:var(--muted);}
.empty-state .icon{font-size:48px;margin-bottom:16px;opacity:.5;}
.empty-state h3{font-size:16px;font-weight:600;margin-bottom:8px;color:var(--ink);}
.empty-state p{font-size:13px;line-height:1.5;}

/* ====== Input Area ====== */
.input-area{flex-shrink:0;padding:8px 12px;padding-bottom:calc(8px + var(--safe-bottom));background:var(--surface);border-top:1px solid var(--border);}
.input-row{display:flex;gap:8px;align-items:flex-end;}
.input-row textarea{flex:1;border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-size:14px;font-family:var(--font);line-height:1.5;resize:none;min-height:42px;max-height:120px;outline:none;transition:border-color .2s;background:var(--bg);color:var(--ink);}
.input-row textarea:focus{border-color:var(--brand-light);}
.input-row .send-btn{width:42px;height:42px;border-radius:50%;border:none;background:var(--brand);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.input-row .send-btn:active{transform:scale(.9);background:var(--brand-dark);}
.input-row .send-btn:disabled{opacity:.4;cursor:not-allowed;}

/* ====== Detail Modal ====== */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;display:none;animation:fadeIn .2s;}
.modal-overlay.show{display:block;}
.modal-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;max-height:85vh;background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:101;overflow-y:auto;transition:transform .3s cubic-bezier(.32,.72,0,1);padding:16px 20px;padding-bottom:calc(16px + var(--safe-bottom));}
.modal-sheet.show{transform:translateX(-50%) translateY(0);}
.modal-sheet .handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 12px;}
.modal-sheet .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.modal-sheet .modal-header h2{font-size:16px;font-weight:700;}
.modal-sheet .close-btn{width:32px;height:32px;border:none;border-radius:50%;background:var(--bg);color:var(--muted);font-size:16px;cursor:pointer;}
.modal-section{margin-bottom:12px;}
.modal-section .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.modal-section .value{font-size:14px;line-height:1.6;}
.modal-section .score-row{display:flex;gap:8px;flex-wrap:wrap;}
.modal-section .score-item{display:flex;flex-direction:column;align-items:center;background:var(--bg);border-radius:var(--radius);padding:8px 12px;min-width:56px;}
.modal-section .score-item .num{font-size:18px;font-weight:700;color:var(--brand);}
.modal-section .score-item .lbl{font-size:10px;color:var(--muted);}
.modal-section .search-result{background:var(--bg);border-radius:var(--radius);padding:10px 12px;margin-bottom:6px;}
.modal-section .search-result .s-title{font-size:13px;font-weight:600;margin-bottom:2px;}
.modal-section .search-result .s-title a{color:var(--brand);text-decoration:none;}
.modal-section .search-result .s-snippet{font-size:12px;color:var(--muted);line-height:1.5;}
.modal-actions{display:flex;gap:8px;margin-top:4px;}
.modal-actions button{flex:1;padding:10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;color:var(--ink);}
.modal-actions button:active{transform:scale(.97);background:var(--bg);}
.modal-actions button.primary{background:var(--brand);color:#fff;border-color:var(--brand);}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ====== Bell Badge ====== */
.bell-badge{position:absolute;top:-2px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--surface);animation:bellPop .3s;}
@keyframes bellPop{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}

/* ====== Notification Panel ====== */
.notif-panel{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;max-height:70vh;background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:101;overflow-y:auto;transition:transform .3s cubic-bezier(.32,.72,0,1);padding:16px 20px;padding-bottom:calc(16px + var(--safe-bottom));}
.notif-panel.show{transform:translateX(-50%) translateY(0);}
.notif-panel .handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 12px;}
.notif-item{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
.notif-item:last-child{border-bottom:none;}
.notif-item .n-icon{width:32px;height:32px;border-radius:50%;background:#fef3c7;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.notif-item .n-body{flex:1;min-width:0;}
.notif-item .n-title{font-size:13px;font-weight:600;margin-bottom:2px;}
.notif-item .n-time{font-size:11px;color:var(--muted);margin-bottom:4px;}
.notif-item .n-msg{font-size:12px;color:var(--ink);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.notif-item .n-action{flex-shrink:0;}
.notif-item .n-action button{width:28px;height:28px;border:none;border-radius:50%;background:var(--bg);color:var(--muted);font-size:14px;cursor:pointer;}

/* ====== Reminder Picker ====== */
.reminder-row{display:flex;gap:8px;align-items:center;margin-top:8px;}
.reminder-row input[type="datetime-local"]{flex:1;border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:13px;font-family:var(--font);outline:none;background:var(--bg);color:var(--ink);}
.reminder-row input[type="datetime-local"]:focus{border-color:var(--brand-light);}
.reminder-row .remind-btn{padding:8px 14px;border:none;border-radius:var(--radius);background:var(--brand);color:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;}
.reminder-row .remind-btn:active{transform:scale(.95);}
.reminder-row .remind-btn:disabled{opacity:.4;cursor:not-allowed;}

/* ====== Toast ====== */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:var(--radius);font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:400px;text-align:center;}
.toast.show{opacity:1;}

/* ====== Stats Badge ====== */
.stats-chip{display:flex;gap:4px;flex-wrap:wrap;padding:8px 0;}
.stats-chip .chip{font-size:11px;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--border);color:var(--muted);}
.stats-chip .chip strong{color:var(--ink);}

/* ====== Loading ====== */
.loading-dots{display:flex;gap:4px;align-items:center;justify-content:center;padding:20px;}
.loading-dots span{width:6px;height:6px;border-radius:50%;background:var(--brand-light);animation:bounce 1.4s infinite;}
.loading-dots span:nth-child(2){animation-delay:.2s;}
.loading-dots span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}

/* ====== Domain Selector ====== */
.domain-selector{display:flex;gap:6px;margin-top:4px;}
.domain-selector .domain-btn{flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;text-align:center;color:var(--muted);}
.domain-selector .domain-btn:active{transform:scale(.95);}
.domain-selector .domain-btn.selected{color:#fff;border-color:transparent;}
.domain-selector .domain-btn.selected.work{background:var(--brand);}
.domain-selector .domain-btn.selected.life{background:#f59e0b;}
.domain-selector .domain-btn.selected.process{background:#06b6d4;}
.domain-selector .domain-btn.selected.other{background:#10b981;}

/* ====== Search tab ====== */
.search-box{display:flex;gap:8px;margin-bottom:10px;}
.search-box input{flex:1;border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-size:14px;font-family:var(--font);outline:none;background:var(--surface);}
.search-box input:focus{border-color:var(--brand-light);}
.search-box button{padding:10px 16px;border:none;border-radius:var(--radius);background:var(--brand);color:#fff;font-size:13px;font-weight:500;cursor:pointer;}

/* ====== Review Card ====== */
.review-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);}
.review-card .review-date{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.review-card .review-date .date-badge{background:#ede9fe;color:var(--brand);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;}
.review-card .review-section{margin-bottom:10px;}
.review-card .review-section .rs-label{font-size:12px;font-weight:600;color:var(--brand);margin-bottom:4px;}
.review-card .review-section .rs-content{font-size:13px;line-height:1.7;color:var(--ink);white-space:pre-wrap;}

.review-input-area{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;margin-bottom:12px;}
.review-input-area textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-size:14px;font-family:var(--font);line-height:1.6;resize:vertical;min-height:80px;max-height:200px;outline:none;background:var(--bg);color:var(--ink);margin-bottom:8px;}
.review-input-area textarea:focus{border-color:var(--brand-light);}
.review-submit-btn{width:100%;padding:10px;border:none;border-radius:var(--radius);background:var(--brand);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;}
.review-submit-btn:active{transform:scale(.97);}
.review-submit-btn:disabled{opacity:.4;cursor:not-allowed;}
.review-submit-btn .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ====== Responsive ====== */
@media (min-width:480px){
  .app{box-shadow:0 0 20px rgba(0,0,0,.06);border-left:1px solid var(--border);border-right:1px solid var(--border);}
}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Header -->
  <header class="app-header">
    <h1><span class="dot"></span> 灵感管家</h1>
    <div class="header-actions">
      <button class="header-btn" id="bellBtn" onclick="toggleNotificationPanel()" title="通知" style="position:relative;">
        🔔
        <span class="bell-badge" id="bellBadge" style="display:none;">0</span>
      </button>
      <button class="header-btn" onclick="refreshCurrent()" title="刷新">↻</button>
    </div>
  </header>

  <!-- Tab Bar -->
  <nav class="tab-bar" id="tabBar">
    <button class="tab-btn active" data-tab="all" onclick="switchTab('all')">全部</button>
    <button class="tab-btn" data-tab="work" onclick="switchTab('work')">🔧 工作 <span class="count" id="countWork">0</span></button>
    <button class="tab-btn" data-tab="life" onclick="switchTab('life')">🌱 生活 <span class="count" id="countLife">0</span></button>
    <button class="tab-btn" data-tab="todo" onclick="switchTab('todo')">✅ 待办 <span class="count" id="countTodo">0</span></button>
    <button class="tab-btn" data-tab="review" onclick="switchTab('review')">📋 复盘</button>
    <button class="tab-btn" data-tab="search" onclick="switchTab('search')">🔍 搜索</button>
  </nav>

  <!-- Content -->
  <div class="content-area" id="contentArea">
    <div class="stats-chip" id="statsChip"></div>
    <div id="ideaList"></div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <textarea id="ideaInput" rows="1" placeholder="输入你的灵感…" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="submitIdea()">↑</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
<div class="modal-sheet" id="modalSheet">
  <div class="handle"></div>
  <div class="modal-header">
    <h2 id="modalTitle">灵感详情</h2>
    <button class="close-btn" onclick="closeModal()">✕</button>
  </div>
  <div id="modalBody"></div>
</div>

<!-- Notification Panel -->
<div class="modal-overlay" id="notifOverlay" onclick="closeNotificationPanel()"></div>
<div class="notif-panel" id="notifPanel">
  <div class="handle"></div>
  <div class="modal-header">
    <h2>🔔 通知提醒</h2>
    <button class="close-btn" onclick="closeNotificationPanel()">✕</button>
  </div>
  <div id="notifBody">
    <div class="empty-state" style="padding:30px 20px;">
      <div class="icon">🔔</div>
      <h3>暂无通知</h3>
      <p>待办事项的提醒会在这里显示</p>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ====== State ======
let allIdeas = [];
let currentTab = 'all';
let isLoading = false;
let notifInterval = null;
let lastNotifCount = 0;

// ====== Auto Resize Textarea ======
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ====== Enter to Send ======
document.getElementById('ideaInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    submitIdea();
  }
});

// ====== Toast ======
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ====== Loading ======
function showLoading() {
  document.getElementById('ideaList').innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
}

// ====== Tab Switching ======
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab === 'review') {
    renderReview();
  } else if (tab === 'search') {
    renderSearch();
  } else {
    renderIdeas();
  }
}

// ====== Fetch Ideas ======
async function fetchIdeas() {
  try {
    const params = new URLSearchParams();
    if (currentTab === 'work') params.set('domain', 'work');
    else if (currentTab === 'life') params.set('domain', 'life');
    else if (currentTab === 'todo') params.set('decision__in', 'todo-work,todo-life');
    const resp = await fetch('/api/ideas?' + params.toString());
    const data = await resp.json();
    allIdeas = data.ideas || [];
    renderStats(data.stats);
    renderIdeas();
  } catch(e) {
    showToast('加载失败，请检查网络');
  }
}

// ====== Render Stats ======
function renderStats(stats) {
  if (!stats) return;
  const chip = document.getElementById('statsChip');
  chip.innerHTML = `
    <span class="chip">📋 共 <strong>${stats.total||0}</strong> 条</span>
    <span class="chip">🔧 <strong>${stats.work||0}</strong></span>
    <span class="chip">🌱 <strong>${stats.life||0}</strong></span>
    <span class="chip">✅ 待办 <strong>${(stats.todo_work||0)+(stats.todo_life||0)}</strong></span>
  `;
  // Update tab bar counts
  document.getElementById('countWork').textContent = stats.work||0;
  document.getElementById('countLife').textContent = stats.life||0;
  document.getElementById('countTodo').textContent = (stats.todo_work||0)+(stats.todo_life||0);
}

// ====== Render Ideas ======
function renderIdeas() {
  const container = document.getElementById('ideaList');
  if (currentTab === 'search' || currentTab === 'review') return;
  let ideas = allIdeas;
  if (currentTab === 'todo') {
    ideas = allIdeas.filter(i => i.decision && i.decision.startsWith('todo'));
  }

  if (!ideas.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">💡</div>
        <h3>还没有灵感</h3>
        <p>在下方输入你的想法，<br>Agent 会自动归类分析</p>
      </div>`;
    return;
  }

  container.innerHTML = ideas.map(idea => `
    <div class="idea-card" onclick="openIdea(${idea.id})">
      <div class="card-top">
        <span class="card-id">#${idea.id}</span>
        <span class="card-time">${idea.created_at || ''}</span>
      </div>
      <div class="card-content">${escapeHtml(idea.content)}</div>
      <div class="card-bottom">
        ${getCardTagHtml(idea)}
      </div>
    </div>

async function doSearch() {
  const query = document.getElementById('searchInput')?.value?.trim();
  if (!query) return;
  const container = document.getElementById('searchResults');
  container.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
  try {
    const resp = await fetch('/api/search', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({query})
    });
    const data = await resp.json();
    if (data.error) {
      container.innerHTML = `<div class="empty-state"><p>搜索出错: ${escapeHtml(data.error)}</p></div>`;
      return;
    }
    if (!data.results || !data.results.length) {
      container.innerHTML = '<div class="empty-state"><p>未找到相关结果</p></div>';
      return;
    }
    container.innerHTML = data.results.map(r => `
      <div class="modal-section">

    `).join('');
  } catch(e) {
    container.innerHTML = `<div class="empty-state"><p>搜索失败: ${escapeHtml(e.message)}</p></div>`;
  }
}

function getDefaultRemindTime() {

}

async function markAsTodo(ideaId, decision) {
  const input = document.getElementById('remindTime');
  if (!input.value) { showToast('请选择提醒时间'); return; }
  const btns = document.querySelectorAll('.todo-btn');
  btns.forEach(b => b.disabled = true);
  try {
    // 1. Update idea decision to todo
    const resp1 = await fetch(`/api/ideas/${ideaId}`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({decision: decision, suggestion: '用户手动标记为待办'})
    });
    const idea = await resp1.json();
    if (!idea.id) { showToast('设置失败'); return; }
    // 2. Set reminder
    const resp2 = await fetch(`/api/ideas/${ideaId}/reminder`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({remind_at: input.value.replace('T', ' ')})

    if (data.ok) {

      fetchIdeas();

      openIdea(ideaId);

    btns.forEach(b => b.disabled = false);
  }

// ====== Notification System ======

async function updateBellBadge() {
  try {
    const resp = await fetch('/api/reminders/count');
    const data = await resp.json();
    const badge = document.getElementById('bellBadge');
    const count = data.count || 0;
    if (count > 0) {
      badge.textContent = count > 99 ? '99+' : count;
      badge.style.display = 'flex';
      // If count increased, show browser notification
      if (count > lastNotifCount) {
        showBrowserNotification(count);
      }
      lastNotifCount = count;
    } else {
      badge.style.display = 'none';
      lastNotifCount = 0;
    }
  } catch(e) {}
}

function showBrowserNotification(count) {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') {
    new Notification('灵感管家', {
      body: `你有 ${count} 条待办提醒待处理`,
      icon: '/static/icons/icon-192.png',
      tag: 'idea-reminder'
    });
    // Also send through Service Worker for background notification
    sendViaServiceWorker('灵感管家', `你有 ${count} 条待办提醒待处理`);
  }
}

function sendViaServiceWorker(title, body, url) {
  if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({
      type: 'show-notification',
      title: title,
      body: body,
      tag: 'idea-reminder-' + Date.now(),
      url: url || '/'
    });
  }
}

async function pollNotifications() {
  try {
    const resp = await fetch('/api/reminders/pending');
    const data = await resp.json();
    if (data.reminders && data.reminders.length > 0) {
      // Show browser notifications
      data.reminders.forEach(r => {
        const title = '⏰ ' + (r.title || r.idea_content || '').slice(0, 30);
        const body = (r.message || r.idea_content || '').slice(0, 100);
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification(title, {
            body: body,
            icon: '/static/icons/icon-192.png',
            tag: 'reminder-' + r.id,
            requireInteraction: true,
            vibrate: [200, 100, 200]
          });
        }
        // Send via Service Worker for background notification
        sendViaServiceWorker(title, body, '/');
      });
      // Auto-dismiss
      for (const r of data.reminders) {
        await fetch(`/api/reminders/${r.id}/dismiss`, {method: 'POST'});
      }
      updateBellBadge();
      // If panel is open, refresh it
      if (document.getElementById('notifPanel').classList.contains('show')) {
        loadNotificationList();
      }
    }
  } catch(e) {}
}

function toggleNotificationPanel() {
  const panel = document.getElementById('notifPanel');
  const overlay = document.getElementById('notifOverlay');
  if (panel.classList.contains('show')) {
    panel.classList.remove('show');
    overlay.classList.remove('show');
  } else {
    overlay.classList.add('show');
    panel.classList.add('show');
    loadNotificationList();
  }
}

function closeNotificationPanel() {
  document.getElementById('notifPanel').classList.remove('show');
  document.getElementById('notifOverlay').classList.remove('show');
}

async function loadNotificationList() {
  const body = document.getElementById('notifBody');
  try {
    const resp = await fetch('/api/reminders/upcoming');
    const data = await resp.json();
    const reminders = data.reminders || [];
    if (!reminders.length) {
      body.innerHTML = `
        <div class="empty-state" style="padding:30px 20px;">
          <div class="icon">🔔</div>
          <h3>暂无通知</h3>
          <p>待办事项的提醒会在这里显示</p>
        </div>`;
      return;
    }
    const now = new Date();
    body.innerHTML = reminders.map(r => {
      const remindTime = new Date(r.remind_at.replace(' ', 'T'));
      const isOverdue = remindTime <= now;
      const timeStr = formatTime(r.remind_at);
      const content = r.idea_content || '';
      return `
        <div class="notif-item">
          <div class="n-icon" style="${isOverdue ? 'background:#fee2e2;' : ''}">${isOverdue ? '⏰' : '📅'}</div>
          <div class="n-body">
            <div class="n-title">${isOverdue ? '⏰ 已到期' : '📅 待提醒'}</div>
            <div class="n-time">${timeStr}</div>
            <div class="n-msg">${escapeHtml(content.slice(0, 80))}</div>
          </div>
          <div class="n-action">
            <button onclick="dismissNotif(${r.id})" title="忽略">✕</button>
          </div>
        </div>
      `;
    }).join('');
  } catch(e) {
    body.innerHTML = '<div class="empty-state" style="padding:30px 20px;"><p>加载失败</p></div>';
  }
}

async function dismissNotif(id) {
  try {
    await fetch(`/api/reminders/${id}/dismiss`, {method: 'POST'});
    loadNotificationList();
    updateBellBadge();
  } catch(e) {}
}

function formatTime(t) {
  if (!t) return '';
  const d = new Date(t.replace(' ', 'T'));
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatReviewDate(t) {
  if (!t) return '复盘';
  const d = new Date(t.replace(' ', 'T'));
  const weekMap = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const week = weekMap[d.getDay()];
  return `${d.getMonth()+1}月${d.getDate()}日 ${week} 复盘`;
}

// ====== Request Notification Permission ======
function requestNotifPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

// ====== Helpers ======
function escapeHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

  'schedule': '进度/排期/里程碑',
  'resource': '人力/设备/预算',
  'risk': '风险识别/应对',
  'quality': '质量/标准/适航',
  'supply-chain': '供应链/采购',
  'daily-thought': '日常感悟/随想/反思',

  'reference': '参考信息/资料',
};

function getTagLabel(tag) {
  return TAG_LABELS[tag] || tag;
}

function getTagClass(tag) {
  const workTags = ['engine-arch','combustion','hydrogen-safety','test-bench','nvh','materials','schedule','resource','risk','quality','supply-chain'];
  const lifeTags = ['daily-thought','personal-todo','health','family','learning','social','travel','finance'];
  const procTags = ['procedure','regulation','doc'];
  if (workTags.includes(tag)) return 'work';
  if (lifeTags.includes(tag)) return 'life';
  if (procTags.includes(tag)) return 'process';
  return 'other';
}

function getDecisionLabel(d) {
  const m = {
    'todo-work': '✅ 工作待办',
    'todo-life': '✅ 生活待办',
    'stash': '📌 暂存',
    'archive': '🗂️ 归档'
  };
  return m[d] || d;
}

function getCardTag(idea) {
  if (idea.decision && idea.decision.startsWith('todo')) return '待办';
  if (idea.domain === 'work') return '工作';
  if (idea.domain === 'life') return '生活';
  return null;
}

function getCardTagHtml(idea) {
  const tag = getCardTag(idea);
  if (!tag) return '';
  const cls = tag === '待办' ? 'todo' : tag.toLowerCase();
  const tabMap = { '工作': 'work', '生活': 'life', '待办': 'todo' };
  const tab = tabMap[tag];
  return `<span class="tag ${cls} tag-clickable" onclick="event.stopPropagation();switchTab('${tab}')">${tag}</span>`;
}

// ====== Version Check ======
const APP_VERSION = '2.2.0';

async function checkVersion() {
  try {
    const resp = await fetch('/api/version?_=' + Date.now());
    const data = await resp.json();
    if (data.version && data.version !== APP_VERSION) {
      console.log('New version detected:', data.version, 'current:', APP_VERSION);
      // Force clear all caches and reload
      if ('caches' in window) {
        caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k))));
      }
      setTimeout(() => window.location.reload(true), 500);
    }
  } catch(e) {}
}

// ====== Init ======
document.addEventListener('DOMContentLoaded', () => {
  fetchIdeas();
  // Check version on startup
  checkVersion();
  // Register service worker with auto-update
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js?v=' + APP_VERSION).then(reg => {
      // Check for SW updates every 30 seconds
      setInterval(() => reg.update().catch(() => {}), 30000);
      // When a new SW takes over, reload the page
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload(true);
      });
    }).catch(() => {});
  }
  // Start notification polling (every 30s)
  updateBellBadge();
  pollNotifications();
  notifInterval = setInterval(() => {
    updateBellBadge();
    pollNotifications();
  }, 30000);
  // Request notification permission (after user interaction)
  document.addEventListener('click', requestNotifPermission, {once: true});
});
</script>
